name: Bug report
description: Report a reproducible problem in this project
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove credentials, private images, personal paths, and other sensitive data from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Provide the release, image tag, extension version, or commit you used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, architecture, browser, installation method, and relevant hardware
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start or install ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include the smallest useful excerpt after removing sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability; security-sensitive reports follow SECURITY.md.
          required: true
